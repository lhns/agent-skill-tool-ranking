# The Recommended stack: one pick per job. Rendered into README.md by scripts/build.py.
#
# status: "In use" | "Trying now" | "Up next" | "Planned" | "Blocked"
#   In use      adopted after a logged trial (or your own baseline)
#   Trying now  on a 2-week trial with an exit test; at most 3 at once
#   Up next     start these first, in table order
#   Planned     picked for its job; install when you work on that kind of project
#   Blocked     picked, but a gate check must pass first (see notes)
# entry and alternates are entry IDs from entries.toml. In notes, {entry-id} renders as a link.
# The ranking tables show picks as "Stack pick" and alternates as "Alternate"; don't set a verdict on them.

gaps = "Proxmox (only immature servers: {infra-gateway-radumalica} has 5 stars, {infra-proximo} exposes 924 tools), Ceph ({infra-ceph-aiops} has 0 stars and looks generated), Docker Swarm ({infra-docker-l337} has 9 stars), Stalwart and S3/MinIO. No cats-effect, fs2, http4s or Circe skill exists; generate them with {build-skill-seekers}."

[[pick]]
job = "Workflow"
entry = "wf-agentsmd"
status = "In use"
load = "Global"
notes = "Your baseline; everything else must beat or complement it"

[[pick]]
job = "Skill install gate"
entry = "safe-skillspector"
status = "Up next"
load = "Before every install"
notes = "Set it up first so every later install gets scanned. `--no-llm` static mode; sends dependency names to OSV.dev"

[[pick]]
job = "Requirements interview"
entry = "wf-mattpocock"
status = "Up next"
load = "Global"
notes = "Install only `grill-with-docs` via `npx skills add` with `DISABLE_TELEMETRY=1`, not the whole plugin"

[[pick]]
job = "Scala language intelligence"
entry = "lang-metals-mcp"
status = "Up next"
load = "Scala projects"
notes = "`cs install metals-mcp`, then `metals-mcp --workspace . --client claude`"
alternates = ["lang-serena"]

[[pick]]
job = "Ghidra analysis"
entry = "re-ghidra-bethington"
status = "Up next"
load = "RE container"
notes = "Headless, `--lazy`, scripts off, `GHIDRA_MCP_FILE_ROOT` set; the bridge holds the token; Ghidra 12.1.3. Statistical tie with {re-pyghidra}, which is leaner (18 tools, official Docker image)"
alternates = ["re-pyghidra"]

